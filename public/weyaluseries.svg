<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Filtro de resplandor neón azul -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo oscuro redondeado -->
  <rect width="512" height="512" rx="110" fill="#0d0f17" />

  <!-- Monograma WS centrado y estilizado -->
  <g transform="translate(42, 130)">
    <!-- 'W' Blanca -->
    <text x="0" y="220" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="900" font-size="280" fill="#ffffff" letter-spacing="-10">W</text>
    
    <!-- 'S' Azul Neón con Brillo -->
    <text x="210" y="220" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="900" font-size="280" fill="#00aaff" filter="url(#glow)" letter-spacing="-10">S</text>
  </g>
</svg>
